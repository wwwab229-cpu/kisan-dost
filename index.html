        // FIX #3: Complete WMO weather code mapping
        const getWeatherDetails = (code) => {
            if (code === 0) return { desc: "Clear / Saaf", icon: "sun", advice: "Mausam saaf hai, faslon ko paani dene ya spray karne ka waqt hai." };
            if (code >= 1 && code <= 3) return { desc: "Cloudy / Baadal", icon: "cloud", advice: "Baadal chaye hue hain, paani lagana rok dein." };
            if (code >= 45 && code <= 48) return { desc: "Fog / Dhund", icon: "cloud", advice: "Dhund hai, fasal ki nami check karein aur spray na karein." };
            if (code >= 51 && code <= 67) return { desc: "Rain / Baarish", icon: "cloud-rain", advice: "Baarish ho rahi hai. Khad abhi na dalein." };
            if (code >= 71 && code <= 77) return { desc: "Snow / Barfbaari", icon: "cloud-snow", advice: "Barfbaari ho rahi hai, fasal ko dhankein aur paali se bachao." };
            if (code >= 80 && code <= 82) return { desc: "Heavy Rain / Tez Baarish", icon: "cloud-rain", advice: "Tez baarish aa rahi hai. Drainage check karein, khet mein na jayen." };
            if (code >= 95 && code <= 99) return { desc: "Thunderstorm / Aandhi", icon: "zap", advice: "Aandhi aa rahi hai. Khet se nikal ayen, bijli se bachein." };
            return { desc: "Normal", icon: "sun", advice: "Mausam normal hai, aam kaam jari rakhein." };

        function App() {

                        const canvas = document.createElement('canvas');
                        const MAX_W = 800;
                        const scale = Math.min(MAX_W / img.width, 1);

                // Build Gemini contents (last 15 turns, alternating user/model)
                const historyContents = [];
                const history = messages.slice(-15);
                for (const m of history) {
                    const role = m.role === 'model' ? 'model' : 'user';

                    if (last && last.role === role) {
                        last.parts[0].text += '\n' + (m.text || '');

                        historyContents.push({ role, parts:[{ text: m.text || '' }] });
                    }
                }

                // Build last user turn (text + optional image)

                if (imageToSend?.base64) {
                    lastUserParts.push({ inline_data: { mime_type: imageToSend.mimeType || 'image/jpeg', data: imageToSend.base64 } });

                lastUserParts.push({ text: userText });

                // Ensure last history turn is not also 'user' (avoid consecutive same role)
                if (historyContents.length > 0 && historyContents[historyContents.length-1].role === 'user') {
                    historyContents[historyContents.length-1].parts[0].text += '\n' + userText;
                    if (imageToSend?.base64) {
                        historyContents[historyContents.length-1].parts.unshift({ inline_data: { mime_type: imageToSend.mimeType || 'image/jpeg', data: imageToSend.base64 } });
                    }
                } else {
                    historyContents.push({ role:'user', parts: lastUserParts });
                }

                const body = {
                    system_instruction: {
                        parts: [{ text: `Tum Kisan Dost ho — Pakistan ke kisanon ka trusted AI assistant, jo AMM Data Solutions ne banaya hai. Tumhara kaam hai professional, accurate aur dost-ana andaz mein zara'at ke mashwaray dena.${passportCtx}${imageNote} Jawab hamesha ${currentLang.label} mein do. Mukhtasar magar mufeed jawab do.` }]
                    },
                    contents: historyContents,
                    generationConfig: { temperature: 0.7, maxOutputTokens: 1024, topP: 0.9 },
                    safetySettings: [
                        { category:'HARM_CATEGORY_HARASSMENT', threshold:'BLOCK_MEDIUM_AND_ABOVE' },
                        { category:'HARM_CATEGORY_HATE_SPEECH', threshold:'BLOCK_MEDIUM_AND_ABOVE' },
                        { category:'HARM_CATEGORY_SEXUALLY_EXPLICIT', threshold:'BLOCK_MEDIUM_AND_ABOVE' },
                        { category:'HARM_CATEGORY_DANGEROUS_CONTENT', threshold:'BLOCK_MEDIUM_AND_ABOVE' }
                    ]
                };

                try {
                    const res = await fetch(
                        `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`,
                        { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) }

                    const data = await res.json();
                    let aiText = 'Jawab nahi mila. Dobara try karein.';

                    setIsLoading(false);

                                        <span className="flex items-center gap-1 text-[9px] font-black bg-red-50 text-red-600 px-2 py-1 rounded-full border border-red-100"><i data-lucide="mic" className="w-2.5 h-2.5"></i> Voice</span>
                                        <span className="flex items-center gap-1 text-[9px] font-black bg-blue-50 text-blue-600 px-2 py-1 rounded-full border border-blue-100"><i data-lucide="camera" className="w-2.5 h-2.5"></i> Image AI</span>

                                        </div>
                                        <div className="flex justify-between items-center bg-white/5 p-3 rounded-xl border border-red-500/30">
                                            <span className="text-[10px] font-bold text-slate-300">Kul Lagat (Expenses)</span>
                                            <span className="text-[12px] font-black text-red-400">- Rs. {cst.toLocaleString()}</span>
                                        </div>
                                        <div className={`flex justify-between items-center p-4 rounded-xl mt-2 ${profit >= 0 ? 'bg-emerald-500/20 border border-emerald-500' : 'bg-red-500/20 border border-red-500'}`}>
                                            <span className="text-[12px] font-black text-white uppercase">{profit >= 0 ? 'Saafi Bachat' : 'Nuqsan'}</span>
                                            <h5 className={`text-xl font-black ${profit >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>Rs. {profit.toLocaleString()}</h5>
                                        </div>
                                    </div>
                                </div>

                                <h3 className="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-3 px-1">Mandi Rates List (Per 40kg / Mann)</h3>
                                <div className="space-y-2 mb-4">
                                    {mandiDatabase[currentCity].rates.slice(0, showAllRates ? 50 : 5).map(item => (
                                        <div key={item.key} className="flex justify-between items-center p-3.5 bg-slate-50 rounded-2xl border border-slate-100">
                                            <span className="text-[14px] font-black text-slate-700">{getMandiLabel(currentLang, item.key)}</span>
                                            <div className="flex items-center gap-2"><span className="text-[13px] font-bold text-slate-600">Rs. {item.rate}</span><i data-lucide={item.trend === 'up' ? 'trending-up' : 'trending-down'} className={`w-3.5 h-3.5 ${item.trend === 'up' ? 'text-emerald-600' : 'text-red-600'}`}></i></div>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => setShowAllRates(!showAllRates)} className="w-full py-3 text-emerald-600 text-[12px] font-black bg-emerald-50 rounded-xl mb-4 border border-emerald-100 active:scale-95 transition-transform">{showAllRates ? "Kam Dekhein" : "Pori Government List Dekhein"}</button>
                                <div className="text-[9px] font-black text-slate-400 uppercase bg-slate-50 py-2.5 rounded-xl border border-slate-100 text-center mb-4"><i data-lucide="database" className="inline w-3 h-3 mr-1 mb-0.5"></i> Source: {mandiDatabase[currentCity].source}</div>
                                <button onClick={() => setIsMandiModalOpen(false)} className="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black text-lg active:scale-95 transition-transform uppercase tracking-wider">Band Karein</button>
                            </div>
                        </div>
                    ) : null}

                    {isCanalModalOpen ? (
                        <div className="fixed inset-0 z-[10000] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4 animate-pop" dir={isRtl ? 'rtl' : 'ltr'}>
                            <div className="bg-white rounded-[2.5rem] w-full max-w-sm overflow-hidden shadow-2xl relative max-h-[90vh] flex flex-col">
                                <div className="corp-gradient p-5 text-white flex justify-between items-center shrink-0">
                                    <div className="flex items-center gap-2"><i data-lucide="droplet" className="w-5 h-5 fill-white"></i><h3 className="font-black text-lg">{t.canal}</h3></div>
                                    <button onClick={() => setIsCanalModalOpen(false)} className="active:scale-90"><i data-lucide="x" className="w-6 h-6"></i></button>
                                </div>
                                <div className="p-6 flex-1 overflow-y-auto custom-scroll bg-white">
                                    <select value={currentCanalRegion} onChange={e => setCurrentCanalRegion(e.target.value)} className="w-full bg-slate-50 border border-slate-200 text-sm font-bold p-3 rounded-xl mb-4 outline-none" dir="ltr">
                                        {Object.keys(canalDatabase).map(region => <option key={region} value={region}>{canalDatabase[region].label}</option>)}
                                    </select>

                                    <div className="text-center mb-5">
                                        <span className={`text-[10px] font-black uppercase tracking-widest px-3 py-1 rounded-full border ${(canalDatabase[currentCanalRegion].overallState.includes('Active') || canalDatabase[currentCanalRegion].overallState.includes('Flow')) ? 'bg-blue-50 text-blue-600 border-blue-100' : 'bg-red-50 text-red-600 border-red-100'}`}>Overall Status: {canalDatabase[currentCanalRegion].overallState}</span>
                                    </div>

                                    <div className="space-y-3 text-left">
                                        {canalDatabase[currentCanalRegion].canals.map((canal, idx) => (
                                            <div key={idx} className="bg-slate-50 p-4 rounded-2xl border border-slate-100 shadow-sm">
                                                <div className="flex justify-between items-center mb-3">
                                                    <h4 className="text-[13px] font-black text-slate-800">{canal.name}</h4>
                                                    <span className={`text-[10px] font-black px-2.5 py-1 rounded-md bg-white border shadow-sm ${canal.color}`}>{canal.state}</span>
                                                </div>
                                                <div className="flex justify-between items-end mb-1.5">
                                                    <span className="text-[9px] font-black text-slate-400 uppercase tracking-widest">Paani ka Level</span>
                                                    <span className={`text-[11px] font-black ${canal.color}`}>{canal.levelText}</span>
                                                </div>
                                                <div className="w-full bg-slate-200 rounded-full h-1.5 overflow-hidden">
                                                    <div className={`h-1.5 rounded-full ${canal.level > 60 ? 'bg-blue-500' : canal.level > 30 ? 'bg-amber-500' : 'bg-red-500'} transition-all duration-1000`} style={{width: `${canal.level}%`}}></div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="mt-5 flex items-center justify-between border-t border-slate-100 pt-4">
                                        <div className="flex items-center gap-1.5 text-[9px] font-black text-slate-400 uppercase"><i data-lucide="database" className="w-3 h-3"></i> {canalDatabase[currentCanalRegion].source}</div>
                                        <div className="text-[9px] font-black text-emerald-600">Sync: {lastCanalSync}</div>
                                    </div>
                                    <button onClick={() => setIsCanalModalOpen(false)} className="w-full bg-slate-900 text-white py-3.5 rounded-2xl font-black text-sm mt-4 active:scale-95 transition-transform uppercase tracking-wider">Theek Hai</button>
                                </div>
                            </div>
                        </div>
                    ) : null}

                    {isWeatherModalOpen ? (
                        <div className="fixed inset-0 z-[10000] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4 animate-pop" dir={isRtl ? 'rtl' : 'ltr'}>
                            <div className="bg-white rounded-[2.5rem] w-full max-w-xs overflow-hidden shadow-2xl relative">
                                <div className="corp-gradient p-5 text-white flex justify-between items-center"><h3 className="font-black text-lg">{t.weather}</h3><button onClick={() => setIsWeatherModalOpen(false)} className="active:scale-90"><i data-lucide="x" className="w-6 h-6"></i></button></div>
                                <div className="p-6 text-center">
                                    <i data-lucide={weatherData.icon} className="w-16 h-16 mx-auto text-sky-500 mb-2"></i>
                                    <h4 className="text-5xl font-black text-slate-800">{weatherData.temp}°C</h4>
                                    <p className="text-sm font-bold text-slate-500 mt-1">{weatherData.isLive ? weatherData.desc : currentLang.ui.weatherDesc}</p>
                                    <p className="text-[11px] font-semibold text-slate-400 mb-5 mt-1 flex justify-center items-center gap-1"><i data-lucide="map-pin" className="w-3 h-3"></i> {weatherData.locationName}</p>
                                    <div className="bg-emerald-50 p-4 rounded-2xl border border-emerald-100 text-[11px] font-bold text-emerald-800 text-left mb-5">💡 <strong>Kisan Dost Mashwara:</strong> {weatherData.isLive ? weatherData.advice : 'Data fetch ho raha hai...'}</div>
                                    <button onClick={fetchLiveWeather} disabled={isRefreshing} className="w-full bg-slate-100 text-slate-600 py-3.5 rounded-2xl font-black text-sm active:scale-95 flex items-center justify-center gap-2">
                                        <div className={isRefreshing ? 'animate-spin' : ''}><i data-lucide="refresh-cw" className="w-4 h-4"></i></div> {isRefreshing ? 'Updating...' : t.refresh}
                                    </button>
                                </div>
                            </div>
                        </div>
                    ) : null}

                    {isToolsMenuOpen ? (
                        <div className="fixed inset-0 z-[10000] flex items-end sm:items-center justify-center bg-black/40 backdrop-blur-sm p-4 animate-pop" dir={isRtl ? 'rtl' : 'ltr'}>
                            <div className="bg-white rounded-[2.5rem] w-full max-w-sm p-6 shadow-2xl relative">
                                <div className="flex justify-between items-center mb-6"><div className="flex items-center gap-3"><div className="bg-amber-100 p-2.5 rounded-xl"><i data-lucide="zap" className="w-5 h-5 text-amber-600 fill-amber-600"></i></div><h2 className="text-xl font-black text-slate-800 tracking-tight">{currentLang.tools.mainBtn}</h2></div><button onClick={() => setIsToolsMenuOpen(false)} className="bg-slate-100 p-2 rounded-full text-slate-500"><i data-lucide="x" className="w-5 h-5"></i></button></div>
                                <div className="space-y-3">
                                    {baseTools.map(tool => (
                                        <button key={tool.id} onClick={() => { setIsToolsMenuOpen(false); setActiveToolModal(tool); }} className={`w-full flex items-center gap-4 p-4 ${tool.bg} rounded-[1.8rem] border border-white shadow-sm active:scale-95 transition-transform`}>
                                            <div className="bg-white p-3 rounded-2xl shadow-sm relative"><i data-lucide={tool.icon} className={`w-6 h-6 ${tool.color}`}></i></div>
                                            <div className="flex-1 text-left"><h4 className="text-[14px] font-black text-slate-800">{currentLang.tools[tool.key][0]}</h4><p className="text-[10px] font-bold text-slate-500 mt-0.5">{currentLang.tools[tool.key][1]}</p></div>
                                            <i data-lucide="chevron-right" className="w-4 h-4 text-slate-400"></i>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    ) : null}

                    {/* FIX #4 cont.: Custom toast notification — replaces browser alert() */}
                    {toastVisible ? (
                        <div className="fixed bottom-28 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-5 py-3 rounded-full text-[12px] font-black shadow-xl z-[99999] animate-pop whitespace-nowrap pointer-events-none">
                            {toastMsg}
                        </div>
                    ) : null}

                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
